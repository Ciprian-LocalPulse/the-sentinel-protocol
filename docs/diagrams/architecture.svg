<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Channels -->
  <rect x="300" y="20" width="300" height="50" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="450" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c2b3a">CHANNELS</text>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="#3a4a5a">Gmail · Slack · Calendar · Webhooks</text>

  <line x1="450" y1="70" x2="450" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cortex -->
  <rect x="250" y="105" width="400" height="70" rx="6" fill="#fdf1e0" stroke="#c98a2d"/>
  <text x="450" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c3d0e">CORTEX</text>
  <text x="450" y="146" text-anchor="middle" font-size="11" fill="#5c3d0e">Ingestion → Sanitize → Fingerprint → Scoring</text>
  <text x="450" y="162" text-anchor="middle" font-size="10" fill="#8a6a3a">docs/cortex/</text>

  <line x1="450" y1="175" x2="450" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fan out -->
  <line x1="450" y1="205" x2="140" y2="240" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="205" x2="450" y2="240" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="205" x2="740" y2="240" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Persona -->
  <rect x="30" y="240" width="220" height="80" rx="6" fill="#e9f5ea" stroke="#3f8c4a"/>
  <text x="140" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e4022">PERSONA</text>
  <text x="140" y="280" text-anchor="middle" font-size="10" fill="#2e5c33">style-matched draft</text>
  <text x="140" y="296" text-anchor="middle" font-size="9" fill="#5a8a5f">docs/persona/</text>
  <text x="140" y="311" text-anchor="middle" font-size="9" fill="#5a8a5f">masks: diplomat/executive/firewall</text>

  <!-- Negotiation -->
  <rect x="340" y="240" width="220" height="80" rx="6" fill="#f7e9f2" stroke="#a13f8c"/>
  <text x="450" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a1e40">NEGOTIATION</text>
  <text x="450" y="280" text-anchor="middle" font-size="10" fill="#6a2e58">pricing / leverage</text>
  <text x="450" y="296" text-anchor="middle" font-size="9" fill="#8a5a7a">docs/negotiation/</text>
  <text x="450" y="311" text-anchor="middle" font-size="9" fill="#8a5a7a">transparent-only, see philosophy.md</text>

  <!-- Energy -->
  <rect x="650" y="240" width="220" height="80" rx="6" fill="#e9eff7" stroke="#3f5f8c"/>
  <text x="760" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e2e40">ENERGY SHIELD</text>
  <text x="760" y="280" text-anchor="middle" font-size="10" fill="#2e4a5c">capacity check</text>
  <text x="760" y="296" text-anchor="middle" font-size="9" fill="#5a7a8a">docs/energy/</text>
  <text x="760" y="311" text-anchor="middle" font-size="9" fill="#5a7a8a">founder's own data only</text>

  <!-- Converge -->
  <line x1="140" y1="320" x2="450" y2="380" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="320" x2="450" y2="380" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="760" y1="320" x2="450" y2="380" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Human review -->
  <rect x="300" y="380" width="300" height="60" rx="6" fill="#fdeaea" stroke="#b23a3a"/>
  <text x="450" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c1e1e">HUMAN REVIEW / SEND</text>
  <text x="450" y="423" text-anchor="middle" font-size="10" fill="#7a2e2e">always the final gate — design-principles.md #2</text>

  <!-- Security wrap -->
  <rect x="15" y="460" width="870" height="80" rx="6" fill="none" stroke="#888" stroke-dasharray="6,4"/>
  <text x="450" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">SECURITY (cross-cutting)</text>
  <text x="450" y="498" text-anchor="middle" font-size="10" fill="#555">Anonymization Layer → Encrypted Transport → Iron Vault (encrypted at rest)</text>
  <text x="450" y="514" text-anchor="middle" font-size="10" fill="#555">docs/security/ — applies to every layer above</text>
  <text x="450" y="530" text-anchor="middle" font-size="9" fill="#888">the-sentinel-protocol — docs/diagrams/architecture.svg</text>
</svg>
