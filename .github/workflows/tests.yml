name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=prototype/python --cov-report=term-missing

      - name: Validate JSON Schemas
        run: |
          python -c "
          import json
          for f in ['schemas/analysis.schema.json', 'schemas/context.schema.json', 'schemas/persona.schema.json']:
              with open(f) as fh:
                  json.load(fh)
              print(f'{f}: valid JSON')
          "
