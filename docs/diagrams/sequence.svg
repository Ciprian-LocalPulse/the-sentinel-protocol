<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c2b3a">Sequence — one message, end to end (docs/architecture.md §4)</text>

  <!-- Lifelines -->
  <g font-size="11" font-weight="bold" fill="#1c2b3a" text-anchor="middle">
    <text x="80" y="55">Channel</text>
    <text x="230" y="55">Cortex</text>
    <text x="390" y="55">Energy</text>
    <text x="540" y="55">Persona</text>
    <text x="700" y="55">Negotiation</text>
    <text x="840" y="55">Founder</text>
  </g>
  <g stroke="#bbb" stroke-width="1">
    <line x1="80" y1="65" x2="80" y2="490"/>
    <line x1="230" y1="65" x2="230" y2="490"/>
    <line x1="390" y1="65" x2="390" y2="490"/>
    <line x1="540" y1="65" x2="540" y2="490"/>
    <line x1="700" y1="65" x2="700" y2="490"/>
    <line x1="840" y1="65" x2="840" y2="490"/>
  </g>

  <g font-size="10" fill="#222">
    <line x1="80" y1="90" x2="225" y2="90" stroke="#333" marker-end="url(#arr)"/>
    <text x="150" y="84" text-anchor="middle">raw message</text>

    <line x1="230" y1="120" x2="230" y2="120" stroke="#333"/>
    <text x="230" y="115" text-anchor="middle">sanitize + fingerprint</text>
    <text x="230" y="130" text-anchor="middle">(ingestion.md)</text>

    <line x1="230" y1="160" x2="230" y2="160" stroke="#333"/>
    <text x="230" y="155" text-anchor="middle">score (FC/EV/TD/SA)</text>
    <text x="230" y="170" text-anchor="middle">(scoring.md)</text>

    <line x1="230" y1="200" x2="385" y2="200" stroke="#333" marker-end="url(#arr)"/>
    <text x="310" y="194" text-anchor="middle">scored event</text>

    <line x1="390" y1="230" x2="390" y2="230" stroke="#333"/>
    <text x="390" y="225" text-anchor="middle">capacity check</text>
    <text x="390" y="240" text-anchor="middle">(biometrics.md)</text>

    <line x1="390" y1="270" x2="535" y2="270" stroke="#333" marker-end="url(#arr)"/>
    <text x="465" y="264" text-anchor="middle">good time? proceed</text>

    <line x1="230" y1="310" x2="695" y2="310" stroke="#333" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="465" y="304" text-anchor="middle">if commercial context: leverage/pricing</text>

    <line x1="700" y1="340" x2="700" y2="340" stroke="#333"/>
    <text x="700" y="335" text-anchor="middle">Lv, offer tiers</text>
    <text x="700" y="350" text-anchor="middle">(algorithms.md)</text>

    <line x1="540" y1="380" x2="540" y2="380" stroke="#333"/>
    <text x="540" y="375" text-anchor="middle">draft (mask-selected)</text>
    <text x="540" y="390" text-anchor="middle">(mirror.md, masks.md)</text>

    <line x1="540" y1="420" x2="835" y2="420" stroke="#333" marker-end="url(#arr)"/>
    <text x="690" y="414" text-anchor="middle">draft surfaced for review</text>

    <line x1="840" y1="450" x2="840" y2="450" stroke="#333"/>
    <text x="840" y="445" text-anchor="middle">approve / edit</text>

    <line x1="840" y1="470" x2="85" y2="470" stroke="#333" marker-end="url(#arr)"/>
    <text x="465" y="464" text-anchor="middle">send (only human-approved action that transmits)</text>
  </g>
</svg>
